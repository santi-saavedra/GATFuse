# Conda environment for GATFuse.
#   conda env create -f environment.yml && conda activate gatfuse
#   pip install --no-deps -e .
#
# STAR is included because GATFuse consumes its output; drop it if alignments
# are produced elsewhere.
name: gatfuse
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.24
  - pandas>=2.0
  - pysam>=0.21
  - pytorch>=2.0
  - pip
  - star>=2.7.8
  - samtools>=1.15
  - pip:
      - torch-geometric>=2.4
